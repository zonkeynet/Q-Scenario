name: Review marketplace submission
on:
  issues:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: marketplace-submission
  cancel-in-progress: false
jobs:
  proposal:
    if: github.event.label.name == 'marketplace-submission' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified upstream
        with:
          persist-credentials: false
      - name: Parse data and propose reviewed catalog changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/process_submission.py
